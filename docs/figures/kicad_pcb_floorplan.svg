  <text x="490" y="48" text-anchor="middle" font-size="12" fill="#475569">Edge.Cuts: 48.0 × 20.0 × 1.6 mm | F.Cu: Seeed XIAO RA4M1, 1.58 kHz USB LPF, JP1 Jumper &amp; VREF Guard | B.Cu: Solid GND Plane</text>

