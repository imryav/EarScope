  <rect x="40" y="450" width="900" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="58" y="463" width="14" height="14" rx="2" fill="#fbbf24" stroke="#334155"/>
  <text x="80" y="474" font-size="11.0" font-weight="600" fill="#1e293b">Active XIAO RA4M1 Pads: +5V (Pad 14 → R13 USB LPF), GND (Pad 13 → Solid B.Cu Plane), D1/A1 (Pad 2 ← 14-Bit ADC_IN)</text>

  <rect x="58" y="488" width="14" height="14" rx="2" fill="#f59e0b" stroke="#78350f"/>
  <text x="80" y="499" font-size="11.0" font-weight="600" fill="#92400e">1.58 kHz Power LPF (R13 = 10 Ω + C9 = 10 µF || C13 = 100 nF) ahead of U3 LDO  •  JP1 Solder Jumper: Open = Earphone, Bridged = Mic</text>

  <rect x="58" y="513" width="14" height="14" rx="2" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="80" y="524" font-size="11.0" fill="#334155">VREF Guard Ring encircles high-Z U1A+ node (CIN / R1)  •  Underside Keepout protects 16 XIAO belly pads  •  4× Snap-Fit Keepouts</text>
